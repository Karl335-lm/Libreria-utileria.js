<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link rel="stylesheet" href="css/stylees.css">
    <!-- Carga de librería JS -->
    <script src="js/utileria.js"></script>
</head>
<body>
    <div class="container">
        <h1>Iniciar Sesión</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="text" id="correo" placeholder="Ingrese un correo válido">
                <div id="errorCorreo" class="error-msg">El correo ingresado no es válido</div>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="********">
                <div id="errorPassword" class="error-msg">Debe tener mínimo 8 caracteres, 1 mayúscula, 1 minúscula, 1 número y 1 carácter especial (@$!%*?&).</div>
            </div>

            <button type="submit">Ingresar</button>
        </form>
        <div class="links">
            <a href="index.html">Ir a Registro</a>
        </div>
     
  <a href="video/programacion.mp4" target="_blank">
    Ver presentación
</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;

            const errCorreo = document.getElementById('errorCorreo');
            const errPassword = document.getElementById('errorPassword');

            let esValido = true;

            // Validaciones
            if (!validarCorreo(correo)) { 
                errCorreo.style.display = 'block'; 
                esValido = false; 
            } else { 
                errCorreo.style.display = 'none'; 
            }

            if (!validarPassword(password)) { 
                errPassword.style.display = 'block'; 
                esValido = false; 
            } else { 
                errPassword.style.display = 'none'; 
            }

            if (esValido) {
                alert("Login exitoso. Las validaciones de utileria.js pasaron correctamente.");
            }
        });
    </script>
</body>
</html>

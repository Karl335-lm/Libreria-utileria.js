<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="css/styleess.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="Contenedor">
        <h1 class="clas2">Iniciar Sesión</h1>

        <form class="formulario">
            <!--Grupo 1: Datos de conversion-->

                <label for="correo"> Correo electrónico </label>
            <input type="text" id="correo" placeholder="Ingrese un correo válido" required>
            </div>

            <!--Grupo de farenheit-->
            <div class="grupo-doble">
                <div class="grupo-formulario">
                    <label for="contra">Contraseña</label>
                    <input type="text" id="contra" placeholder="Ingrese una contraseña válida" required>
                    </div>
                    </div>
                    
           <button type="submit" class="boton-ingresar">
        Ingresar </button>
    <button type="button" class="boton-registro">
     No tengo cuenta: Registrarme </button>
        
    </form>
    </div> 
</body>
